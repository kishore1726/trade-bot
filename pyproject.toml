[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tradebot"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["pandas", "numpy", "yfinance", "httpx", "pyyaml"]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
tradebot = "tradebot.cli:main"

[tool.setuptools]
packages = ["tradebot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
